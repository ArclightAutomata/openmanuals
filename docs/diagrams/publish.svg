<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="t d">
<title id="t">Publishing and syncing snapshots</title>
<desc id="d">Each build is published as an immutable version with a zstd copy, a row diff from the previous version, page hashes, a lookup filter and a signed manifest; clients use diffs, the compressed copy, the filter or range reads.</desc>
