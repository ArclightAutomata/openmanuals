<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="640" viewBox="0 0 1220 640" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a signed fact</title>
<desc id="d">A fact envelope is canonicalized with RFC 8785, hashed to its id and signed by the author's key; the author is the key's fingerprint, and identity proofs link keys to accounts.</desc>
