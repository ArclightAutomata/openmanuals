<title id="t">Verifying pages from an untrusted mirror</title>
<desc id="d">The extension trusts a mirror's manifest only if it is signed by the pinned server key; the manifest lists hashes of groups of page hashes, which verify every 16 KiB page fetched with a Range request.</desc>
