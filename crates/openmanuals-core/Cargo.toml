[package]
name = "openmanuals-core"
description = "OpenManuals fact format: canonical JSON, fact ids, keys, signatures, identifiers"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Native-only: key generation, raw/JWS signing, OpenSSH private key loading.
sign = ["dep:rand_core", "ed25519-dalek/rand_core", "ssh-key/std"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = "0.4"
thiserror = { workspace = true }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
data-encoding = "2"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize"] }
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519"] }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
# Reading zip files (stored and deflate only; pure Rust, so it builds for wasm too).
zip = { version = "7", default-features = false, features = ["deflate-flate2", "deflate64"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]

[[example]]
name = "gen_vectors"
required-features = ["sign"]
