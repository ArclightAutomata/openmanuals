<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenManuals — edit a manual</title>
  <link rel="stylesheet" href="editor.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 13px; color: var(--ink); background: var(--bg); }
    header { background: var(--green); color: #fff; padding: 10px 14px; font-weight: 700; font-size: 14px; }
    header .mark { width: 22px; height: 22px; vertical-align: -5px; margin-right: 6px; }
    #msg { padding: 10px 14px; color: var(--red); font-weight: 600; }
    #msg:empty { display: none; }
  </style>
</head>
<body>
  <header><img class="mark" src="icons/logo.svg" alt="" width="22" height="22">OpenManuals · edit a manual</header>
  <div id="msg"></div>
  <section id="editor"></section>
  <script type="module" src="edit.js"></script>
</body>
</html>
