<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenManuals — this page</title>
  <link rel="stylesheet" href="editor.css">
  <style>
    :root { --green: #2f7d5b; --ink: #1c2321; --muted: #5f6b66; --line: #e1e5df; --bg: #f6f7f5; --red: #b91c1c; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 13px; color: var(--ink); background: var(--bg); }
    header { background: var(--green); color: #fff; padding: 10px 14px; font-weight: 700; font-size: 14px; }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 2; }
    .bar label { color: var(--muted); }
    select { padding: 4px 6px; border: 1px solid #d5d9d3; border-radius: 6px; font-size: 13px; background: #fff; }
    button { padding: 5px 10px; border: none; border-radius: 6px; background: var(--green); color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; }
    button.secondary { background: #e5efe9; color: #1f5b40; }
    button.danger { background: var(--red); }
    button.link { background: none; color: #1a6ea8; padding: 0 2px; text-decoration: underline; font-weight: 600; }
    button:disabled { opacity: .45; cursor: default; }
    #msg { padding: 6px 12px; min-height: 16px; color: var(--muted); }
    #msg.ok { color: var(--green); font-weight: 600; } #msg.bad { color: var(--red); font-weight: 600; }
    ul#rows { list-style: none; margin: 0; padding: 0 0 120px; }
    li.row { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: start; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fff; }
    li.row:hover { background: #f1f6f3; }
    li.row.focus { animation: flash 1.6s ease-out; }
    @keyframes flash { from { background: #d6ecdf; } to { background: #fff; } }
    li.row input { margin-top: 2px; }
    .title { font-weight: 600; word-break: break-word; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
    .acts { display: flex; gap: 6px; }
    .pending { grid-column: 2 / 4; font-size: 12px; color: var(--ink); background: #fff7e0; border-radius: 6px; padding: 4px 8px; }
    .state-error .title, .state-hidden .title { color: var(--muted); }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #eef1ec; color: var(--muted); margin-left: 4px; font-weight: 600; }
    .tag.you { background: #dcefe4; color: #1f5b40; }
    .tag.bad { background: #fee2e2; color: #991b1b; }
    .tag.done { background: #e0ecff; color: #1d4ed8; }
    #bulk { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 12px; box-shadow: 0 -2px 8px rgba(0,0,0,.06); z-index: 3; }
    #bulk .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #confirm { margin-top: 8px; padding: 8px 10px; background: #fff7e0; border-radius: 8px; }
    #confirm ul { margin: 6px 0; padding-left: 18px; color: var(--muted); }
    .hidden { display: none !important; }
    .empty { padding: 18px 14px; color: var(--muted); }
    header .mark { width: 22px; height: 22px; vertical-align: -5px; margin-right: 6px; }
  </style>
</head>
<body>
  <header><img class="mark" src="icons/logo.svg" alt="" width="22" height="22">OpenManuals · this page</header>
  <div class="bar">
    <label for="pick">Select</label>
    <select id="pick"><option value="">…</option></select>
    <label for="reason">Report as</label>
    <select id="reason">
      <option value="spam">Spam</option>
      <option value="wrong-file">Wrong file</option>
      <option value="malware">Malware</option>
      <option value="impersonation">Impersonation</option>
    </select>
  </div>
  <div id="msg"></div>
  <section id="editor" class="hidden"></section>
  <ul id="rows"></ul>
  <div id="empty" class="empty hidden"></div>
  <div id="bulk" class="hidden">
    <div class="line">
      <span id="count"></span>
      <button id="bulkRetract" class="danger">Retract</button>
      <button id="bulkReport">Report</button>
      <button id="clear" class="link">Clear</button>
    </div>
    <div id="confirm" class="hidden">
      <div id="confirmText"></div>
      <ul id="confirmList"></ul>
      <div class="line"><button id="confirmGo" class="danger">Sign and send</button><button id="confirmCancel" class="secondary">Cancel</button></div>
    </div>
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
