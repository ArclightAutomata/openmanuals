<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenManuals</title>
  <style>
    body { width: 340px; margin: 0; font-family: system-ui, sans-serif; font-size: 14px; color: #1c2321; }
    header { display: flex; align-items: center; justify-content: space-between; background: #2f7d5b; color: #fff; padding: 12px 14px; font-weight: 700; }
    header a { color: #fff; font-weight: 500; font-size: 12px; opacity: 0.9; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .body { padding: 14px; }
    #status { margin-bottom: 12px; line-height: 1.45; }
    .ok { color: #2f7d5b; font-weight: 700; }
    .muted { color: #5f6b66; }
    .warn { color: #b45309; }
    .blue { color: #2563eb; }
    .title { display: block; margin: 4px 0 8px; color: #1c2321; }
    .btn { display: block; box-sizing: border-box; width: 100%; padding: 9px; margin-top: 6px; border: none; border-radius: 6px; background: #2f7d5b; color: #fff; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; font-size: 14px; font-family: inherit; }
    .btn.secondary { background: #e5efe9; color: #1f5b40; }
    .btn.ghost { background: transparent; color: #5f6b66; font-weight: 500; border: 1px solid #d5d9d3; }
    #status a { color: #1a6ea8; }
    .id { font-size: 13px; color: #5f6b66; margin-top: 12px; padding-top: 10px; border-top: 1px solid #e5e7eb; display: flex; align-items: center; gap: 10px; }
    .id a { color: #1a6ea8; text-decoration: none; }
    .id a:hover { text-decoration: underline; }
    .id .who { display: flex; align-items: center; gap: 10px; min-width: 0; color: inherit; }
    .id .who:hover .name { text-decoration: underline; }
    .id .avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; object-fit: cover; background: #e5efe9; border: 1px solid #d5d9d3; box-sizing: border-box; }
    .id .avatar.blank { display: grid; place-items: center; color: #1f5b40; font-weight: 700; font-size: 14px; }
    .id .text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
    .id .name { color: #1c2321; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .id .fp { font: 11px ui-monospace, monospace; color: #5f6b66; }
    .id .fp .count { font: 11px system-ui, sans-serif; }
    .copies { font-size: 12px; color: #5f6b66; margin: 4px 0 0; }
    .outbox { font-size: 12px; color: #5f6b66; margin-top: 8px; }
    .outbox b { color: #1c2321; }
    .row { display: flex; gap: 6px; }
    .row .btn { margin-top: 6px; }
    input.url { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #d5d9d3; border-radius: 6px; font-size: 13px; margin-top: 6px; }
    header .mark { width: 22px; height: 22px; vertical-align: -5px; margin-right: 6px; }
  </style>
</head>
<body>
  <header><span><img class="mark" src="icons/logo.svg" alt="" width="22" height="22">OpenManuals</span><a href="#" id="options">Settings</a></header>
  <div class="body">
    <div id="status" class="muted">Open a manual on a supported manuals site to see whether it's already preserved.</div>
    <div id="actions"></div>
    <div class="outbox" id="outbox"></div>
    <div class="id" id="identity"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
